<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Books Library</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .book-list { list-style: none; padding: 0; }
        .book-item { background: #f9f9f9; margin: 15px 0; padding: 15px 20px; border-left: 5px solid #3498db; border-radius: 4px; transition: 0.3s; }
        .book-item:hover { background: #f1f1f1; transform: translateY(-2px); }
        .book-item a { text-decoration: none; font-size: 18px; color: #2980b9; font-weight: bold; display: block; }
        .book-desc { font-size: 14px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trading Books List</h1>
        <p>Yahan aapko sabhi mukhya trading books ke detailed summaries aur guides milengi.</p>
        
        <ul class="book-list">
            <li class="book-item">
                <a href="book.html">Trading Volatility: Correlation, Term Structure and Skew</a>
                <div class="book-desc">Colin Bennett ki yeh book options, volatility, skew aur term structure ko vistar se samjhati hai.</div>
            </li>
            <!-- Jab aap aur books jodne chahein, unhe yahan niche add kar sakte hain -->
        </ul>
    </div>
</body>
</html>
