<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login & Signup | ICT Forex Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#22c55e', 600: '#16a34a' },
                        secondary: { 500: '#a855f7', 600: '#9333ea' },
                        accent: { 500: '#eab308' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#0b0f19] text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="bg-[#131b2e] border-b border-gray-800 px-4 md:px-6 py-3 flex justify-between items-center sticky top-0 z-50 shadow-xl">
        <a href="index.html" class="flex items-center gap-2.5 group cursor-pointer">
            <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-gradient-to-tr from-red-600 via-orange-500 to-green-500 p-0.5 shadow-[0_0_18px_rgba(34,197,94,0.5)] flex items-center justify-center flex-shrink-0">
                <div class="w-full h-full bg-[#131b2e] rounded-full flex items-center justify-center">
                    <span class="text-xs md:text-sm font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-green-400">ICT</span>
                </div>
            </div>
            <div>
                <h1 class="text-xs md:text-base font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-orange-400 to-green-400 drop-shadow">
                    ICT FOREX ACADEMY
                </h1>
                <p class="text-[9px] md:text-[10px] text-gray-400 font-medium tracking-wide">Student Portal</p>
            </div>
        </a>

        <nav class="flex items-center gap-3 text-xs font-bold text-gray-300">
            <a href="index.html" class="bg-gray-800 hover:bg-gray-700 text-green-400 border border-green-500/30 px-3 py-1.5 rounded-xl transition flex items-center gap-1.5">
                <i class="fa-solid fa-house"></i> Home
            </a>
        </nav>
    </header>

    <!-- LOGIN / SIGNUP CONTAINER -->
    <main class="flex-1 flex items-center justify-center p-4">
        <div class="bg-[#131b2e] border border-gray-800 rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl space-y-6">
            
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-green-500/10 text-green-400 border border-green-500/20 rounded-2xl mx-auto flex items-center justify-center text-xl shadow">
                    <i class="fa-solid fa-user-lock"></i>
                </div>
                <h2 class="text-xl font-black text-white">Student Portal Access</h2>
                <p class="text-gray-400 text-xs">Sign in to access your courses and mentorship.</p>
            </div>

            <!-- Tabs for Sign In / Sign Up -->
            <div class="flex bg-gray-900 p-1 rounded-2xl border border-gray-800 text-xs font-bold text-center">
                <button onclick="switchTab('signin')" id="tab-signin" class="flex-1 py-2.5 rounded-xl bg-green-500 text-gray-950 transition shadow">Sign In</button>
                <button onclick="switchTab('signup')" id="tab-signup" class="flex-1 py-2.5 rounded-xl text-gray-400 hover:text-white transition">Sign Up</button>
            </div>

            <!-- Sign In Form -->
            <form id="form-signin" class="space-y-4 text-xs">
                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Email Address</label>
                    <input type="email" required placeholder="student@example.com" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-green-500">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Password</label>
                    <input type="password" required placeholder="••••••••" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-green-500">
                </div>
                <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-gray-950 font-black py-3 rounded-xl shadow transition">
                    Login to Academy
                </button>
            </form>

            <!-- Sign Up Form (Hidden by default) -->
            <form id="form-signup" class="space-y-4 text-xs hidden">
                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Full Name</label>
                    <input type="text" required placeholder="John Doe" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-green-500">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Email Address</label>
                    <input type="email" required placeholder="student@example.com" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-green-500">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Create Password</label>
                    <input type="password" required placeholder="••••••••" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-green-500">
                </div>
                <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-gray-950 font-black py-3 rounded-xl shadow transition">
                    Create Free Account
                </button>
            </form>

        </div>
    </main>

    <script>
        function switchTab(tab) {
            const signInForm = document.getElementById('form-signin');
            const signUpForm = document.getElementById('form-signup');
            const signInTab = document.getElementById('tab-signin');
            const signUpTab = document.getElementById('tab-signup');

            if(tab === 'signin') {
                signInForm.classList.remove('hidden');
                signUpForm.classList.add('hidden');
                signInTab.className = "flex-1 py-2.5 rounded-xl bg-green-500 text-gray-950 transition shadow font-bold";
                signUpTab.className = "flex-1 py-2.5 rounded-xl text-gray-400 hover:text-white transition font-bold";
            } else {
                signInForm.classList.add('hidden');
                signUpForm.classList.remove('hidden');
                signUpTab.className = "flex-1 py-2.5 rounded-xl bg-green-500 text-gray-950 transition shadow font-bold";
                signInTab.className = "flex-1 py-2.5 rounded-xl text-gray-400 hover:text-white transition font-bold";
            }
        }
    </script>

    <!-- FOOTER -->
    <footer class="bg-[#131b2e] border-t border-gray-800 mt-12 py-6 text-center text-xs text-gray-400 space-y-2">
        <p>ICT Forex Academy © 2026. All rights reserved.</p>
        <p>
            <a href="privacy-policy.html" class="text-green-400 hover:underline font-bold">Privacy Policy & Terms</a>
        </p>
    </footer>

</body>
</html>
