<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - ICT Forex Academy</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Navigation Bar -->
    <nav class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-xl font-bold tracking-wider text-amber-500">ICT FOREX</a>
                </div>
                <div class="hidden md:flex items-center space-x-6">
                    <a href="index.html" class="hover:text-amber-400 transition">Home</a>
                    <a href="free-learning.html" class="hover:text-amber-400 transition">Free Learning</a>
                    <a href="vip-course.html" class="hover:text-amber-400 transition">VIP Course</a>
                    <a href="login.html" class="text-amber-500 font-medium">Portal Login</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content / Authentication Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-xl p-8 shadow-2xl">
            
            <!-- Header Title -->
            <div class="text-center mb-8">
                <h1 id="form-title" class="text-2xl font-bold text-white">Student Sign In</h1>
                <p class="text-sm text-gray-400 mt-2">Access your ICT Forex Academy resources</p>
            </div>

            <!-- Error/Success Message Box -->
            <div id="message-box" class="hidden mb-4 p-3 rounded text-sm text-center"></div>

            <!-- Auth Form -->
            <form id="auth-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                    <input type="email" id="email" required class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition" placeholder="you@example.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                    <input type="password" id="password" required class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition" placeholder="••••••••">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-3 rounded-lg transition shadow-lg">
                    Sign In
                </button>
            </form>

            <!-- Toggle between Sign In and Sign Up -->
            <div class="text-center mt-6">
                <p class="text-sm text-gray-400">
                    <span id="toggle-label">Don't have an account?</span> 
                    <a href="javascript:void(0);" id="toggle-link" class="text-amber-500 font-medium hover:underline ml-1">Sign Up</a>
                </p>
            </div>

            <!-- Logged In View (Hidden by default) -->
            <div id="user-dashboard" class="hidden text-center space-y-4">
                <div class="text-amber-500 text-5xl mb-2"><i class="fa-solid fa-user-check"></i></div>
                <h2 class="text-xl font-semibold text-white">Welcome Back!</h2>
                <p id="user-email-display" class="text-sm text-gray-400"></p>
                <button id="logout-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition">
                    Sign Out
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-400">
            <p>&copy; 2026 ICT Forex Academy. All rights reserved.</p>
            <div class="mt-2 space-x-4">
                <a href="privacy-policy.html" class="hover:text-amber-400 transition">Privacy Policy & Terms</a>
            </div>
        </div>
    </footer>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqdOgOd2wqDjh-2AL8_zRb41zIOHYu7lU",
            authDomain: "ict-forex.firebaseapp.com",
            projectId: "ict-forex",
            storageBucket: "ict-forex.firebasestorage.app",
            messagingSenderId: "10739160076",
            appId: "1:10739160076:web:0560474e8cf4a43254ca29",
            measurementId: "G-32WBMZK9DW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const authForm = document.getElementById('auth-form');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const toggleLabel = document.getElementById('toggle-label');
        const toggleLink = document.getElementById('toggle-link');
        const messageBox = document.getElementById('message-box');
        const userDashboard = document.getElementById('user-dashboard');
        const userEmailDisplay = document.getElementById('user-email-display');
        const logoutBtn = document.getElementById('logout-btn');

        let isSignUp = false;

        // Direct Toggle Link Click Handler
        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            isSignUp = !isSignUp;
            if (isSignUp) {
                formTitle.textContent = "Create Account";
                submitBtn.textContent = "Sign Up";
                toggleLabel.textContent = "Already have an account?";
                toggleLink.textContent = "Sign In";
            } else {
                formTitle.textContent = "Student Sign In";
                submitBtn.textContent = "Sign In";
                toggleLabel.textContent = "Don't have an account?";
                toggleLink.textContent = "Sign Up";
            }
            messageBox.classList.add('hidden');
        });

        // Form Submit Handler
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            messageBox.classList.add('hidden');

            try {
                if (isSignUp) {
                    await createUserWithEmailAndPassword(auth, email, password);
                    showMessage("Account created successfully!", "success");
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    showMessage("Signed in successfully!", "success");
                }
            } catch (error) {
                showMessage(error.message, "error");
            }
        });

        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                showMessage("Signed out successfully.", "success");
            } catch (error) {
                showMessage(error.message, "error");
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authForm.classList.add('hidden');
                document.querySelector('.text-center.mt-6').classList.add('hidden');
                formTitle.classList.add('hidden');
                userDashboard.classList.remove('hidden');
                userEmailDisplay.textContent = `Logged in as: ${user.email}`;
            } else {
                authForm.classList.remove('hidden');
                document.querySelector('.text-center.mt-6').classList.remove('hidden');
                formTitle.classList.remove('hidden');
                userDashboard.classList.add('hidden');
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            }
        });

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.classList.remove('hidden');
            if (type === 'error') {
                messageBox.className = "mb-4 p-3 rounded text-sm text-center bg-red-950 text-red-400 border border-red-800";
            } else {
                messageBox.className = "mb-4 p-3 rounded text-sm text-center bg-green-950 text-green-400 border border-green-800";
            }
        }
    </script>
</body>
</html>
