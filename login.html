<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Sign In - ICT Forex Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #030712; color: #f3f4f6; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        nav { background-color: #111827; border-bottom: 1px solid #1f2937; position: sticky; top: 0; z-index: 50; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 16px; display: flex; justify-content: space-between; height: 64px; align-items: center; }
        .logo { font-size: 20px; font-weight: bold; color: #f59e0b; text-decoration: none; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 24px; }
        .nav-links a { color: #d1d5db; text-decoration: none; font-size: 14px; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: #f59e0b; }
        main { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px; }
        .card { max-width: 400px; width: 100%; background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .card-header { text-align: center; margin-bottom: 24px; }
        .card-header h1 { font-size: 24px; font-weight: bold; color: #ffffff; margin-bottom: 8px; }
        .card-header p { font-size: 14px; color: #9ca3af; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: #d1d5db; margin-bottom: 8px; }
        .form-control { width: 100%; background-color: #030712; border: 1px solid #1f2937; border-radius: 8px; padding: 12px 16px; color: #ffffff; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .form-control:focus { border-color: #f59e0b; }
        .btn { width: 100%; background-color: #f59e0b; color: #030712; font-weight: bold; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; margin-top: 8px; transition: background-color 0.2s; }
        .btn:hover { background-color: #d97706; }
        .footer-text { text-align: center; margin-top: 24px; font-size: 14px; color: #9ca3af; }
        .footer-text a { color: #f59e0b; text-decoration: none; font-weight: 500; }
        .footer-text a:hover { text-decoration: underline; }
        
        #message-box { 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 14px; 
            text-align: center; 
            margin-bottom: 20px; 
            font-weight: 500;
            display: none; 
        }
        .error-msg { background-color: #450a0a !important; color: #f87171 !important; border: 1px solid #7f1d1d !important; display: block !important; }
        .success-msg { background-color: #064e3b !important; color: #34d399 !important; border: 1px solid #065f46 !important; display: block !important; }

        .hidden { display: none !important; }
        footer { background-color: #111827; border-top: 1px solid #1f2937; padding: 24px 0; text-align: center; font-size: 14px; color: #9ca3af; }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">ICT FOREX</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="free-learning.html">Free Learning</a>
                <a href="vip-course.html">VIP Course</a>
                <a href="login.html" class="active">Portal Login</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="card">
            <div id="card-header-box" class="card-header">
                <h1>Student Sign In</h1>
                <p>Access your ICT Forex Academy account</p>
            </div>

            <div id="message-box"></div>

            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" required class="form-control" placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required class="form-control" placeholder="••••••••">
                </div>

                <button type="submit" class="btn">Sign In</button>
            </form>

            <div id="signup-prompt" class="footer-text">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>

            <!-- Dashboard View after login -->
            <div id="user-dashboard" class="hidden" style="text-align: center;">
                <div style="color: #f59e0b; font-size: 48px; margin-bottom: 12px;"><i class="fa-solid fa-user-check"></i></div>
                <h2 style="font-size: 20px; font-weight: bold; color: white; margin-bottom: 8px;">Welcome Back!</h2>
                <p id="user-email-display" style="font-size: 14px; color: #9ca3af; margin-bottom: 20px;"></p>
                <button id="logout-btn" class="btn" style="background-color: #dc2626; color: white;">Sign Out</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 ICT Forex Academy. All rights reserved.</p>
    </footer>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqdOgOd2wqDjh-2AL8_zRb41zIOHYu7lU",
            authDomain: "ict-forex.firebaseapp.com",
            projectId: "ict-forex",
            storageBucket: "ict-forex.firebasestorage.app",
            messagingSenderId: "10739160076",
            appId: "1:10739160076:web:0560474e8cf4a43254ca29",
            measurementId: "G-32WBMZK9DW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('login-form');
        const messageBox = document.getElementById('message-box');
        const userDashboard = document.getElementById('user-dashboard');
        const userEmailDisplay = document.getElementById('user-email-display');
        const logoutBtn = document.getElementById('logout-btn');
        const cardHeaderBox = document.getElementById('card-header-box');
        const signupPrompt = document.getElementById('signup-prompt');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            showMsg("Logging in...", "success");

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showMsg("Signed in successfully!", "success");
            } catch (error) {
                let errorMsg = error.message;
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    errorMsg = "Email ya password galat hai!";
                }
                showMsg(errorMsg, "error");
            }
        });

        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                showMsg("Signed out successfully.", "success");
            } catch (error) {
                showMsg(error.message, "error");
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginForm.classList.add('hidden');
                signupPrompt.classList.add('hidden');
                cardHeaderBox.classList.add('hidden');
                userDashboard.classList.remove('hidden');
                userEmailDisplay.textContent = `Logged in as: ${user.email}`;
            } else {
                loginForm.classList.remove('hidden');
                signupPrompt.classList.remove('hidden');
                cardHeaderBox.classList.remove('hidden');
                userDashboard.classList.add('hidden');
            }
        });

        function showMsg(text, type) {
            messageBox.textContent = text;
            messageBox.style.display = "block";
            if (type === 'error') {
                messageBox.className = "error-msg";
            } else {
                messageBox.className = "success-msg";
            }
        }
    </script>
</body>
</html>
