<!-- Firebase Login & Firestore Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqdOgOd2wqDjh-2AL8_zRb41zIOHYu7lU",
            authDomain: "ict-forex.firebaseapp.com",
            projectId: "ict-forex",
            storageBucket: "ict-forex.firebasestorage.app",
            messagingSenderId: "10739160076",
            appId: "1:10739160076:web:0560474e8cf4a43254ca29",
            measurementId: "G-32WBMZK9DW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            const authLink = document.getElementById('auth-nav-link');
            if (!authLink) return;

            if (user) {
                authLink.textContent = "Logout";
                authLink.href = "#";
                authLink.onclick = async (e) => {
                    e.preventDefault();
                    localStorage.removeItem('userName');
                    localStorage.removeItem('userAccess');
                    await signOut(auth);
                    window.location.reload();
                };
            } else {
                authLink.textContent = "Portal Login";
                authLink.href = "login.html";
                authLink.onclick = null;
            }
        });

        // Login Function with Firestore Integration
        window.handleLogin = async function() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const messageBox = document.getElementById('message-box');

            messageBox.className = "";
            messageBox.textContent = "";
            messageBox.style.display = "none";

            if (!email || !password) {
                showMsg("Kripya email aur password bharein!", "error");
                return;
            }

            try {
                showMsg("Logging in...", "success");
                // 1. Firebase Authentication
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Fetch User Profile from Firestore (`users` collection)
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);

                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    // Save user details in localStorage for UI use
                    localStorage.setItem('userName', userData.fullName || "User");
                    localStorage.setItem('userAccess', userData.accessLevel || "Free");
                }

                showMsg("Successfully login ho gaya! Home page par bhej rahe hain...", "success");
                
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);

            } catch (error) {
                let errorMsg = "Login karne mein samasya aayi hai.";
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    errorMsg = "Email ya password galat hai!";
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = "Email address galat format mein hai.";
                } else {
                    errorMsg = error.message;
                }
                showMsg(errorMsg, "error");
            }
        };

        function showMsg(text, type) {
            const messageBox = document.getElementById('message-box');
            messageBox.textContent = text;
            messageBox.style.display = "block";
            if (type === 'error') {
                messageBox.className = "error-msg";
            } else {
                messageBox.className = "success-msg";
            }
        }
    </script>
