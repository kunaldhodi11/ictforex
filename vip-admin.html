<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIP Admin | ICT Forex</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<header class="border-b border-slate-800 bg-slate-900 p-4"><div class="mx-auto flex max-w-5xl items-center justify-between"><div><p class="text-xs font-bold tracking-widest text-violet-300">ICT FOREX ACADEMY</p><h1 class="text-xl font-black">VIP Approval Admin</h1></div><button id="logout" class="rounded-lg bg-red-600 px-4 py-2 text-sm font-bold">Logout</button></div></header>
<main class="mx-auto max-w-5xl space-y-5 p-4 py-8">
<section class="rounded-2xl border border-violet-500/30 bg-violet-950/30 p-5"><h2 class="text-2xl font-black">VIP Applications</h2><p class="mt-2 text-sm text-slate-300">Trading ID ko broker account ke saath manually verify karne ke baad hi approve karein.</p></section>
<section class="grid grid-cols-4 gap-2 text-center"><div class="rounded-xl bg-slate-900 p-3"><p class="text-xs text-slate-400">Total</p><b id="total">0</b></div><div class="rounded-xl bg-slate-900 p-3"><p class="text-xs text-slate-400">Pending</p><b id="pending" class="text-yellow-300">0</b></div><div class="rounded-xl bg-slate-900 p-3"><p class="text-xs text-slate-400">Approved</p><b id="approved" class="text-green-300">0</b></div><div class="rounded-xl bg-slate-900 p-3"><p class="text-xs text-slate-400">Rejected</p><b id="rejected" class="text-red-300">0</b></div></section>
<div class="flex flex-wrap items-center justify-between gap-2"><h3 class="font-bold">Applications</h3><div class="flex gap-2"><select id="filter" class="rounded-lg border border-slate-700 bg-slate-900 p-2 text-sm"><option value="pending">Pending</option><option value="all">All</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><button id="refresh" class="rounded-lg bg-slate-700 px-3 py-2 text-sm">Refresh</button></div></div>
<p id="notice" class="rounded-xl bg-slate-900 p-4 text-sm" role="status">Checking admin access…</p><div id="list" class="space-y-3"></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,setDoc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const ADMIN="z2WKjc5DCxb85G71SGpZ55wPfFD2";
const config={apiKey:"AIzaSyCqdOgOd2wqDjh-2AL8_zRb41zIOHYu7lU",authDomain:"ict-forex.firebaseapp.com",projectId:"ict-forex",storageBucket:"ict-forex.firebasestorage.app",messagingSenderId:"10739160076",appId:"1:10739160076:web:0560474e8cf4a43254ca29",measurementId:"G-32WBMZK9DW"};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);let rows=[];
const el=id=>document.getElementById(id),safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function note(s){el("notice").textContent=s;}
function render(){
 const f=el("filter").value,items=rows.filter(x=>f==="all"||x.status===f);el("list").innerHTML="";
 if(!items.length){el("list").textContent="Is filter mein koi application nahi hai.";return;}
 for(const x of items){const d=document.createElement("article");d.className="rounded-xl border border-slate-800 bg-slate-900 p-4";
 d.innerHTML='<div class="flex flex-wrap justify-between gap-2"><div><p class="text-xs font-bold text-violet-300">'+safe(x.broker)+'</p><p class="mt-1 text-lg font-black">'+safe(x.tradingId)+'</p><p class="break-all text-xs text-slate-500">UID: '+safe(x.uid||x.id)+'</p></div><b class="text-sm">'+safe(x.status)+'</b></div>'+(x.status==="pending"||x.status==="rejected"?'<div class="mt-4 flex gap-2"><button data-a="yes" class="rounded-lg bg-green-500 px-4 py-2 text-xs font-black text-black">Approve VIP</button><button data-a="no" class="rounded-lg bg-red-700 px-4 py-2 text-xs font-bold">Reject</button></div>':"");
 if(x.status==="pending"||x.status==="rejected"){d.querySelector('[data-a="yes"]').onclick=()=>review(x,"approved");d.querySelector('[data-a="no"]').onclick=()=>review(x,"rejected");}el("list").append(d);}
}
async function load(){note("Applications load ho rahi hain…");try{const s=await getDocs(collection(db,"vipApplications"));rows=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));for(const k of ["total","pending","approved","rejected"])el(k).textContent=k==="total"?rows.length:rows.filter(x=>x.status===k).length;note("Loaded. Approval se pehle broker par details verify karein.");render();}catch(e){note("Load error: "+e.message+" — Firestore Rules publish aur admin login check karein.");}}
async function review(x,status){if(!confirm(status==="approved"?"Is user ko VIP access approve karein?":"Is application ko reject karein?"))return;try{if(status==="approved")await setDoc(doc(db,"vipAccess",x.id),{approved:true,approvedAt:serverTimestamp(),approvedBy:auth.currentUser.uid,broker:x.broker,tradingId:x.tradingId});else await setDoc(doc(db,"vipAccess",x.id),{approved:false,updatedAt:serverTimestamp(),updatedBy:auth.currentUser.uid});await updateDoc(doc(db,"vipApplications",x.id),{status,reviewedAt:serverTimestamp(),reviewedBy:auth.currentUser.uid});note(status==="approved"?"Approved — VIP access active.":"Application rejected.");await load();}catch(e){note("Action failed: "+e.message);}}
el("refresh").onclick=load;el("filter").onchange=render;el("logout").onclick=async()=>{await signOut(auth);location.href="login.html";};
onAuthStateChanged(auth,async u=>{if(!u){location.href="login.html";return;}if(u.uid!==ADMIN){document.body.innerHTML="<main class='mx-auto max-w-2xl p-6 text-center'><h1 class='text-2xl font-black text-red-400'>Access denied</h1><p class='mt-3 text-slate-300'>Logged-in Firebase UID:</p><code class='mt-2 block break-all rounded-lg bg-slate-900 p-3 text-sm'>"+u.uid+"</code><p class='mt-4 text-slate-300'>Admin UID configured in this panel:</p><code class='mt-2 block break-all rounded-lg bg-slate-900 p-3 text-sm'>"+ADMIN+"</code><p class='mt-4 text-xs text-slate-400'>Dono UID exactly same hone chahiye. Agar code update abhi live nahi hua, hosting deployment complete hone ka wait karein.</p><a class='mt-5 inline-block text-violet-300 underline' href='vip-course.html'>Back to VIP Course</a></main>";return;}await load();});
</script></body></html>
