<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f">
<title>Trader Profile | ICTFOREX Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2b;--line:rgba(148,163,184,.17);--muted:#91a3b9;--text:#f5f8fc;--gold:#f6b94b;--blue:#42b8ff;--green:#36d399}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#12304a 0,transparent 32%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}.shell{width:min(1000px,calc(100% - 32px));margin:auto}header{height:72px;border-bottom:1px solid var(--line);background:#07111fe8;backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}.nav{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{font:700 16px 'Space Grotesk';letter-spacing:.5px}.brand i{color:var(--gold);margin-right:9px}.navlinks{display:flex;gap:20px;color:#c2cede;font-size:12px;font-weight:700}.navlinks a:hover{color:var(--gold)}main{padding:38px 0 70px}.panel{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#0e1d2e,#0a1726);box-shadow:0 18px 55px #0003}.profile{padding:26px}.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.avatar{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#fbd58a,#d99124);color:#101a27;font:700 27px 'Space Grotesk';border:4px solid #ffffff12;flex-shrink:0}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.identity{flex:1;min-width:180px}.identity h1{font:700 26px 'Space Grotesk';margin:0 0 6px}.handle{font-size:12px;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #f6b94b66;border-radius:11px;padding:10px 16px;background:linear-gradient(100deg,#ffda8a,#f0ad36);color:#101a27;font-weight:800;font-size:12px;cursor:pointer}.btn.secondary{background:#10243a;color:#dce8f5;border-color:var(--line)}.btn:disabled{opacity:.6;cursor:wait}.bio{margin:22px 0 18px;color:#d1dce9;font-size:13px;line-height:1.7;white-space:pre-wrap}.stats{display:flex;gap:30px;border-top:1px solid var(--line);padding-top:18px}.stat{font-size:11px;color:var(--muted);cursor:pointer}.stat strong{display:block;color:white;font-size:17px;margin-bottom:3px}.section-title{font:700 16px 'Space Grotesk';margin:28px 0 14px}.posts{display:grid;gap:13px}.post{padding:18px}.post-meta{color:var(--muted);font-size:11px;margin-bottom:10px}.post p{font-size:13px;line-height:1.7;white-space:pre-wrap}.post img{max-width:100%;max-height:420px;object-fit:contain;border-radius:13px;border:1px solid var(--line)}.empty,.notice{padding:22px;color:var(--muted);font-size:13px;text-align:center}.edit{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.edit.show{display:block}.edit label{display:block;font-size:11px;color:var(--muted);margin-bottom:7px}.photo-tools{margin:16px 0;padding:14px;border:1px solid var(--line);border-radius:13px;background:#07111f88}.photo-tools input{display:block;width:100%;margin:10px 0;color:var(--muted);font-size:11px}.photo-tools img{display:none;width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid #f6b94b;margin:10px 0}.edit textarea{width:100%;min-height:80px;background:#07111f;border:1px solid var(--line);border-radius:11px;padding:12px;color:white;font:13px 'DM Sans';resize:vertical}.edit .btn{margin-top:9px}.status{font-size:12px;color:var(--muted);margin-top:12px}.composer{padding:20px;margin-top:22px;border-top:1px solid var(--line)}.composer h2{font:700 16px 'Space Grotesk';margin:0 0 12px}.composer textarea{width:100%;min-height:95px;background:#07111f;border:1px solid var(--line);border-radius:11px;padding:12px;color:white;font:13px 'DM Sans';resize:vertical}.composer input[type=file]{display:block;width:100%;margin:12px 0;color:var(--muted);font-size:12px}.composer img{display:none;max-width:100%;max-height:240px;object-fit:contain;border-radius:12px;margin:10px 0}.composer button{margin-top:8px}.status.error{color:#ff9999}.status.success{color:#75e0b3}footer{text-align:center;color:#71839a;font-size:11px;padding:25px;border-top:1px solid var(--line)}
@media(max-width:600px){.navlinks{gap:11px;font-size:11px}.profile{padding:19px}.identity h1{font-size:22px}.stats{justify-content:space-between;gap:10px}}
</style></head>
<body>
<header><div class="shell nav"><a class="brand" href="community.html"><i class="fa-solid fa-chart-line"></i>ICTFOREX COMMUNITY</a><nav class="navlinks"><a href="community.html">Community Feed</a><a href="index.html">Home</a><a id="account-link" href="login.html">Sign in</a></nav></div></header>
<main class="shell">
<section class="panel profile">
<div class="top"><div class="avatar" id="avatar">T</div><div class="identity"><h1 id="name">Loading profile…</h1><div class="handle" id="handle">ICTFOREX trader</div></div><div class="actions"><button class="btn" id="follow-btn" hidden>Follow</button><button class="btn secondary" id="edit-btn" hidden><i class="fa-solid fa-pen"></i> Edit profile</button></div></div>
<p class="bio" id="bio">Loading profile details…</p>
<div class="stats"><div class="stat"><strong id="posts-count">0</strong>Posts</div><div class="stat"><strong id="followers-count">0</strong>Followers</div><div class="stat"><strong id="following-count">0</strong>Following</div></div>
<div class="edit" id="edit-panel"><div class="photo-tools"><label for="avatar-file">Profile photo (JPG, PNG or WEBP · Max 5 MB)</label><input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp"><img id="avatar-preview" alt="Profile photo preview"><button class="btn" id="save-avatar" type="button">Upload profile photo</button><div class="status" id="avatar-status"></div></div><label for="bio-input">Your trading bio (up to 300 characters)</label><textarea id="bio-input" maxlength="300" placeholder="Example: Forex trader | Learning ICT & Smart Money Concepts"></textarea><button class="btn" id="save-bio">Save profile</button><div class="status" id="edit-status"></div></div>
</section>
<section class="panel composer" id="post-composer" hidden><h2><i class="fa-solid fa-square-plus" style="color:var(--gold)"></i> Share on your profile</h2><form id="profile-post-form"><textarea id="profile-post-content" maxlength="3000" required placeholder="Share your market analysis, trading setup or learning update…"></textarea><label style="display:block;font-size:11px;color:var(--muted);margin-top:12px">Upload chart image (optional) · JPG, PNG or WEBP · Max 5 MB</label><input id="profile-post-image" type="file" accept="image/jpeg,image/png,image/webp"><img id="profile-post-preview" alt="Selected chart preview"><button class="btn" id="profile-publish-btn" type="submit"><i class="fa-solid fa-paper-plane"></i> Publish post</button><div class="status" id="profile-post-status" aria-live="polite"></div></form></section>
<h2 class="section-title"><i class="fa-solid fa-chart-line" style="color:var(--gold)"></i> Trading posts</h2>
<section class="posts" id="posts"><div class="panel empty">Loading posts…</div></section>
</main><footer>ICTFOREX Community · Share knowledge, respect risk, grow together.</footer>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,deleteDoc,collection,getDocs,query,where,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCqdOgOd2wqDjh-2AL8_zRb41zIOHYu7lU",authDomain:"ict-forex.firebaseapp.com",projectId:"ict-forex",storageBucket:"ict-forex.firebasestorage.app",messagingSenderId:"10739160076",appId:"1:10739160076:web:0560474e8cf4a43254ca29",measurementId:"G-32WBMZK9DW"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);let viewer=null,targetUid=null,targetData={};
const initials=s=>String(s||'Trader').trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'T';
function msg(s){$('edit-status').textContent=s;}
function showAvatar(url){const box=$('avatar');box.replaceChildren();if(url&&typeof url==='string'&&url.startsWith('https://res.cloudinary.com/')){const img=document.createElement('img');img.src=url;img.alt='Trader profile photo';box.append(img);}else{box.textContent=initials(targetData.fullName||'Trader');}}
$('avatar-file').addEventListener('change',()=>{const file=$('avatar-file').files?.[0],preview=$('avatar-preview');if(!file){preview.removeAttribute('src');preview.style.display='none';return;}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){$('avatar-file').value='';preview.removeAttribute('src');preview.style.display='none';$('avatar-status').textContent='Choose JPG, PNG or WEBP under 5 MB.';return;}preview.src=URL.createObjectURL(file);preview.style.display='block';$('avatar-status').textContent='';});
$('save-avatar').addEventListener('click',async()=>{if(!viewer||viewer.uid!==targetUid)return;const file=$('avatar-file').files?.[0],btn=$('save-avatar');if(!file){$('avatar-status').textContent='Please choose a photo first.';return;}btn.disabled=true;$('avatar-status').textContent='Uploading photo…';try{const data=new FormData();data.append('file',file);data.append('upload_preset','ictforex_community');data.append('folder','ictforex/profiles');const response=await fetch('https://api.cloudinary.com/v1_1/k7g5uhbi/image/upload',{method:'POST',body:data});const result=await response.json();if(!response.ok||!result.secure_url)throw new Error(result.error?.message||'Upload failed');await setDoc(doc(db,'publicProfiles',viewer.uid),{uid:viewer.uid,fullName:viewer.displayName||localStorage.getItem('userName')||targetData.fullName||'Trader',bio:targetData.bio||'',photoURL:result.secure_url},{merge:true});targetData.photoURL=result.secure_url;showAvatar(result.secure_url);$('avatar-status').textContent='Profile photo updated successfully.';$('avatar-status').className='status success';$('avatar-file').value='';$('avatar-preview').style.display='none';}catch(err){console.error(err);$('avatar-status').textContent='Could not upload photo: '+(err.message||'Please try again.');$('avatar-status').className='status error';}finally{btn.disabled=false;}});
function postMsg(s,type=''){const el=$('profile-post-status');el.textContent=s;el.className='status '+type;}
$('profile-post-image').addEventListener('change',()=>{const file=$('profile-post-image').files?.[0],preview=$('profile-post-preview');if(!file){preview.removeAttribute('src');preview.style.display='none';return;}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){$('profile-post-image').value='';preview.removeAttribute('src');preview.style.display='none';postMsg('Choose JPG, PNG or WEBP under 5 MB.','error');return;}preview.src=URL.createObjectURL(file);preview.style.display='block';});
$('profile-post-form').addEventListener('submit',async e=>{e.preventDefault();if(!viewer||viewer.uid!==targetUid)return;const content=$('profile-post-content').value.trim(),file=$('profile-post-image').files?.[0],btn=$('profile-publish-btn');if(!content){postMsg('Please write something before publishing.','error');return;}if(content.length>3000){postMsg('Post must be 3,000 characters or less.','error');return;}if(file&&(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)){postMsg('Choose JPG, PNG or WEBP under 5 MB.','error');return;}btn.disabled=true;try{let imageUrl='';if(file){postMsg('Uploading image…');const data=new FormData();data.append('file',file);data.append('upload_preset','ictforex_community');const response=await fetch('https://api.cloudinary.com/v1_1/k7g5uhbi/image/upload',{method:'POST',body:data});const result=await response.json();if(!response.ok||!result.secure_url)throw new Error(result.error?.message||'Image upload failed');imageUrl=result.secure_url;}postMsg('Publishing post…');const postData={authorId:viewer.uid,authorName:String(viewer.displayName||localStorage.getItem('userName')||targetData.fullName||'Trader').slice(0,100),content,chartUrl:'',likes:[],createdAt:serverTimestamp()};if(imageUrl)postData.imageUrl=imageUrl;await addDoc(collection(db,'communityPosts'),postData);$('profile-post-form').reset();$('profile-post-preview').removeAttribute('src');$('profile-post-preview').style.display='none';postMsg('Your post has been published!','success');await loadProfile();}catch(err){console.error('Profile post failed',err);postMsg('Could not publish. Please try again. '+(err.message||''),'error');}finally{btn.disabled=false;}});
async function loadProfile(){
 if(!targetUid){$('posts').innerHTML='<div class="panel empty">No profile selected. Sign in to view your profile.</div>';return;}
 const snap=await getDoc(doc(db,'publicProfiles',targetUid));
 if(!snap.exists()){if(viewer&&viewer.uid===targetUid){const privateSnap=await getDoc(doc(db,'users',targetUid));if(privateSnap.exists()){const privateData=privateSnap.data();await setDoc(doc(db,'publicProfiles',targetUid),{uid:targetUid,fullName:privateData.fullName||viewer.displayName||'Trader',bio:'',photoURL:''},{merge:true});return loadProfile();}}$('name').textContent='Trader profile';$('bio').textContent='This trader profile is not available yet.';return;}
 targetData=snap.data();const name=targetData.fullName||targetData.displayName||'ICTFOREX Trader';
 $('name').textContent=name;$('handle').textContent='ICTFOREX member';showAvatar(targetData.photoURL);$('bio').textContent=targetData.bio||'No bio added yet. Share what you are learning in the markets.';
 $('bio-input').value=targetData.bio||'';
 const [posts,followers,following]=await Promise.all([
 getDocs(query(collection(db,'communityPosts'),where('authorId','==',targetUid))),
 getDocs(collection(db,'users',targetUid,'followers')),
 getDocs(collection(db,'users',targetUid,'following'))
 ]);
 $('posts-count').textContent=posts.size;$('followers-count').textContent=followers.size;$('following-count').textContent=following.size;
 const list=posts.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>dateMs(b.createdAt)-dateMs(a.createdAt));
 const box=$('posts');box.replaceChildren();
 if(!list.length){box.innerHTML='<div class="panel empty">No posts yet. Share your first market analysis in the Community Feed.</div>';return;}
 for(const p of list){const card=document.createElement('article');card.className='panel post';const meta=document.createElement('div');meta.className='post-meta';meta.textContent=dateLabel(p.createdAt)+' · '+(Array.isArray(p.likes)?p.likes.length:0)+' likes';const body=document.createElement('p');body.textContent=p.content||'';card.append(meta,body);if(typeof p.imageUrl==='string'&&p.imageUrl.startsWith('https://res.cloudinary.com/')){const img=document.createElement('img');img.src=p.imageUrl;img.alt='Trading chart';card.append(img);}box.append(card);}
}
function dateMs(v){try{return v?.toMillis?v.toMillis():new Date(v||0).getTime()||0}catch{return 0}}
function dateLabel(v){const n=dateMs(v);return n?new Date(n).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'Recently posted'}
async function refreshFollow(){if(!viewer||!targetUid||viewer.uid===targetUid){$('follow-btn').hidden=true;return;}const ref=doc(db,'users',viewer.uid,'following',targetUid);const snap=await getDoc(ref);$('follow-btn').hidden=false;$('follow-btn').textContent=snap.exists()?'Following ✓':'Follow +';$('follow-btn').classList.toggle('secondary',snap.exists());}
$('follow-btn').addEventListener('click',async()=>{if(!viewer){location.href='login.html?returnUrl='+encodeURIComponent(location.pathname+location.search);return;}const btn=$('follow-btn');btn.disabled=true;try{const followingRef=doc(db,'users',viewer.uid,'following',targetUid),followerRef=doc(db,'users',targetUid,'followers',viewer.uid);const existing=await getDoc(followingRef);if(existing.exists()){await Promise.all([deleteDoc(followingRef),deleteDoc(followerRef)]);}else{const data={uid:viewer.uid,fullName:viewer.displayName||localStorage.getItem('userName')||'Trader',createdAt:new Date().toISOString()};await Promise.all([setDoc(followingRef,data),setDoc(followerRef,{uid:viewer.uid,createdAt:new Date().toISOString()})]);}await loadProfile();await refreshFollow();}catch(e){console.error('Follow action failed',e);alert('Follow update failed. Firestore security rules may need updating.');}finally{btn.disabled=false;}});
$('edit-btn').addEventListener('click',()=>$('edit-panel').classList.toggle('show'));
$('save-bio').addEventListener('click',async()=>{if(!viewer||viewer.uid!==targetUid)return;const bio=$('bio-input').value.trim();if(bio.length>300){msg('Bio must be 300 characters or less.');return;}try{await setDoc(doc(db,'publicProfiles',viewer.uid),{uid:viewer.uid,fullName:viewer.displayName||localStorage.getItem('userName')||'Trader',bio},{merge:true});$('bio').textContent=bio||'No bio added yet.';msg('Profile updated successfully.');}catch(e){console.error(e);msg('Could not save profile. Check Firestore permissions.');}});
onAuthStateChanged(auth,async user=>{viewer=user;$('account-link').textContent=user?(user.displayName||'Account'):'Sign in';$('account-link').href=user?'profile.html?uid='+encodeURIComponent(user.uid):'login.html';const params=new URLSearchParams(location.search);targetUid=params.get('uid')||(user?user.uid:null);if(user&&targetUid===user.uid){$('edit-btn').hidden=false;$('post-composer').hidden=false;if(!$('bio-input').value)$('bio-input').value='';}try{await loadProfile();await refreshFollow();}catch(e){console.error('Profile load failed',e);$('posts').innerHTML='<div class="panel empty">Could not load this profile. Please refresh or check Firestore permissions.</div>';}}); 
</script></body></html>
