<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Forex - Sign In / Sign Up</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 350px; }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
        input { width: 100%; padding: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; border-radius: 6px; box-sizing: border-box; }
        .btn { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 10px; }
        .btn:hover { background: #1d4ed8; }
        .toggle-text { text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; cursor: pointer; }
        .toggle-text span { color: #38bdf8; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="form-title">Sign In</h2>
        <form id="authForm" onsubmit="handleLogin(event)">
            <div class="input-group" id="nameGroup" style="display: none;">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Apna naam likhein">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="email@example.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit" class="btn" id="submit-btn">Sign In</button>
        </form>
        <div class="toggle-text" onclick="toggleMode()">
            <span id="toggle-info">Account nahi hai? Sign Up karein</span>
        </div>
    </div>

    <script>
        let isSignUp = false;

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById('form-title').innerText = isSignUp ? 'Sign Up' : 'Sign In';
            document.getElementById('submit-btn').innerText = isSignUp ? 'Sign Up' : 'Sign In';
            document.getElementById('nameGroup').style.display = isSignUp ? 'block' : 'none';
            document.getElementById('toggle-info').innerText = isSignUp ? 'Pehle se account hai? Sign In karein' : 'Account nahi hai? Sign Up karein';
        }

        function handleLogin(event) {
            event.preventDefault();
            // Login successful mark kar rahe hain
            localStorage.setItem('isLoggedIn', 'true');
            // Ab main website / dashboard par bhej denge
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
