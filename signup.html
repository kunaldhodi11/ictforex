<!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqdOgOd2wqDjh-2AL8_zRb41zIOHYu7lU",
            authDomain: "ict-forex.firebaseapp.com",
            projectId: "ict-forex",
            storageBucket: "ict-forex.firebasestorage.app",
            messagingSenderId: "10739160076",
            appId: "1:10739160076:web:0560474e8cf4a43254ca29",
            measurementId: "G-32WBMZK9DW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const signupForm = document.getElementById('signup-form');
        const messageBox = document.getElementById('message-box');

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;

            messageBox.classList.add('hidden');

            // Password matching check
            if (password !== confirmPassword) {
                showMessage("Passwords match nahi ho rahe hain! Kripya check karein.", "error");
                return;
            }

            if (password.length < 6) {
                showMessage("Password kam se kam 6 characters ka hona chahiye.", "error");
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                showMessage("Account successfully ban gaya hai! Login page par bhej rahe hain...", "success");
                
                // Thoda time dekar redirect karein taaki message saaf dikhe
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 3000);

            } catch (error) {
                let errorMsg = "Kuch galat ho gaya hai. Dobara koshish karein.";
                
                // Professional error handling for Firebase
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg = "Yeh email pehle se registered hai! Kripya Sign In karein.";
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = "Email address Sahi nahi hai.";
                }
                
                showMessage(errorMsg, "error");
            }
        });

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.classList.remove('hidden');
            if (type === 'error') {
                messageBox.className = "mb-4 p-3 rounded text-sm text-center bg-red-950 text-red-400 border border-red-800";
            } else {
                messageBox.className = "mb-4 p-3 rounded text-sm text-center bg-green-950 text-green-400 border border-green-800";
            }
        }
    </script>
