<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - ICT Forex Academy</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Navigation Bar -->
    <nav class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-xl font-bold tracking-wider text-amber-500">ICT FOREX</a>
                </div>
                <div class="hidden md:flex items-center space-x-6">
                    <a href="index.html" class="hover:text-amber-400 transition">Home</a>
                    <a href="free-learning.html" class="hover:text-amber-400 transition">Free Learning</a>
                    <a href="vip-course.html" class="hover:text-amber-400 transition">VIP Course</a>
                    <a href="login.html" class="text-amber-500 font-medium">Portal Login</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content / Sign Up Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-xl p-8 shadow-2xl">
            
            <!-- Header Title -->
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-white">Create Account</h1>
                <p class="text-sm text-gray-400 mt-2">Join ICT Forex Academy today</p>
            </div>

            <!-- Error/Success Message Box -->
            <div id="message-box" class="hidden mb-4 p-3 rounded text-sm text-center"></div>

            <!-- Sign Up Form -->
            <form id="signup-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                    <input type="email" id="signup-email" required class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition" placeholder="you@example.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                    <input type="password" id="signup-password" required class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition" placeholder="••••••••">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Confirm Password</label>
                    <input type="password" id="signup-confirm-password" required class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition" placeholder="••••••••">
                </div>

                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-3 rounded-lg transition shadow-lg mt-2">
                    Sign Up
                </button>
            </form>

            <!-- Link back to Sign In -->
            <div class="text-center mt-6">
                <p class="text-sm text-gray-400">
                    Already have an account? 
                    <a href="login.html" class="text-amber-500 font-medium hover:underline ml-1">Sign In</a>
                </p>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-400">
            <p>&copy; 2026 ICT Forex Academy. All rights reserved.</p>
            <div class="mt-2 space-x-4">
                <a href="privacy-policy.html" class="hover:text-amber-400 transition">Privacy Policy & Terms</a>
            </div>
        </div>
    </footer>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqdOgOd2wqDjh-2AL8_zRb41zIOHYu7lU",
            authDomain: "ict-forex.firebaseapp.com",
            projectId: "ict-forex",
            storageBucket: "ict-forex.firebasestorage.app",
            messagingSenderId: "10739160076",
            appId: "1:10739160076:web:0560474e8cf4a43254ca29",
            measurementId: "G-32WBMZK9DW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const signupForm = document.getElementById('signup-form');
        const messageBox = document.getElementById('message-box');

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;

            messageBox.classList.add('hidden');

            // Password matching validation
            if (password !== confirmPassword) {
                showMessage("Passwords do not match! Please check.", "error");
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                showMessage("Account created successfully! Redirecting to login...", "success");
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);
            } catch (error) {
                showMessage(error.message, "error");
            }
        });

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.classList.remove('hidden');
            if (type === 'error') {
                messageBox.className = "mb-4 p-3 rounded text-sm text-center bg-red-950 text-red-400 border border-red-800";
            } else {
                messageBox.className = "mb-4 p-3 rounded text-sm text-center bg-green-950 text-green-400 border border-green-800";
            }
        }
    </script>
</body>
</html>
